<div class="calendar">
  <div class="calendar-bar">
    <button type="button" class="ghost icon" (click)="shift(-1)" aria-label="Previous month">←</button>
    <h2>{{ title() }}</h2>
    <button type="button" class="ghost icon" (click)="shift(1)" aria-label="Next month">→</button>
  </div>
  <div class="weekdays" aria-hidden="true">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>
  <div class="days" role="grid" aria-label="Availability">
    @for (cell of cells(); track $index) {
      @if (cell.date) {
        <button type="button" [class]="'day ' + mark(cell)" (click)="select(cell)" [attr.aria-label]="cell.label">
          {{ cell.day }}
        </button>
      } @else {
        <span class="day outside"></span>
      }
    }
  </div>
  <div class="key" aria-label="Calendar key">
    <span><i class="swatch open"></i> Open</span>
    <span><i class="swatch held"></i> Held</span>
    <span><i class="swatch booked"></i> Booked</span>
  </div>
  @if (note()) {
    <p class="hint">{{ note() }}</p>
  }
</div>
